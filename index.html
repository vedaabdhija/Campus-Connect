<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusConnect — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f8ef7;
      --primary-d: #3a7de0;
      --bg: #0f1117;
      --surface: #171b26;
      --surface2: #1e2235;
      --border: #2a2f45;
      --text: #e8eaf0;
      --muted: #6b7280;
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,142,247,0.12) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(123,94,167,0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
      pointer-events: none;
    }
    @keyframes float {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(30px, 20px); }
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Brand header above card */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--primary), #7b5ea7);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(79,142,247,0.3);
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
    }

    /* Tab switcher */
    .tab-row {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      background: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,142,247,0.4);
    }

    /* Form fields */
    .field-group {
      margin-bottom: 14px;
    }
    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field-wrap {
      position: relative;
    }
    .field-wrap i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .field-input {
      width: 100%;
      padding: 11px 13px 11px 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .field-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
    }
    .field-input::placeholder { color: var(--muted); }
    select.field-input { cursor: pointer; }

    /* Login button */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), #6b6ef7);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(79,142,247,0.35);
      letter-spacing: 0.2px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79,142,247,0.45);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { opacity: 0.7; pointer-events: none; }

    /* Divider */
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 16px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* Role badges */
    .role-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }
    .role-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      cursor: pointer;
      transition: all .2s;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .role-pill:hover { border-color: var(--primary); color: var(--text); }
    .role-pill.selected {
      border-color: var(--primary);
      background: rgba(79,142,247,0.1);
      color: var(--primary);
      font-weight: 600;
    }
    .role-pill .role-icon { font-size: 18px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e2235;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 9999;
      transition: transform .3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: rgba(34,197,94,0.15); border-color: var(--green); color: var(--green); }
    .toast.danger  { background: rgba(239,68,68,0.15);  border-color: var(--red);   color: var(--red); }

    /* Mobile */
    @media (max-width: 480px) {
      body { align-items: flex-end; padding: 0; }
      .login-wrapper { max-width: 100%; }
      .brand-header { margin-bottom: 16px; padding-top: 32px; }
      .login-card {
        border-radius: 24px 24px 0 0;
        padding: 28px 20px 40px;
        border-bottom: none;
      }
      .field-input { font-size: 16px; padding: 13px 13px 13px 38px; }
      .btn-login { padding: 15px; font-size: 16px; }
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <!-- Brand -->
  <div class="brand-header">
    <div class="brand-logo">🎓</div>
    <div class="brand-name">CampusConnect</div>
    <div class="brand-sub">Attendance Management Portal</div>
  </div>

  <!-- Card -->
  <div class="login-card">

    <!-- Tab switcher -->
    <div class="tab-row">
      <button class="tab-btn active" id="tabLogin" onclick="showLogin()">Sign In</button>
      <button class="tab-btn" id="tabRegister" onclick="showRegister()">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginBox">
      <!-- Role selector -->
      <div class="role-pills" id="rolePills">
        <div class="role-pill selected" data-role="student" onclick="selectRole('student')">
          <span class="role-icon">👨‍🎓</span><span>Student</span>
        </div>
        <div class="role-pill" data-role="faculty" onclick="selectRole('faculty')">
          <span class="role-icon">👨‍🏫</span><span>Faculty</span>
        </div>
        <div class="role-pill" data-role="parent" onclick="selectRole('parent')">
          <span class="role-icon">👨‍👩‍👧</span><span>Parent</span>
        </div>
        <div class="role-pill" data-role="admin" onclick="selectRole('admin')">
          <span class="role-icon">👨‍💼</span><span>Admin</span>
        </div>
      </div>
      <input type="hidden" id="role" value="student">

      <div class="field-group">
        <label class="field-label">Username</label>
        <div class="field-wrap">
          <i class="fas fa-user"></i>
          <input class="field-input" id="username" placeholder="Enter your username" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <i class="fas fa-lock"></i>
          <input class="field-input" id="password" type="password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()">
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="login()">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerBox" style="display:none">
      <div class="field-group">
        <label class="field-label">Role</label>
        <div class="field-wrap">
          <i class="fas fa-user-tag"></i>
          <select class="field-input" id="regRole">
            <option value="student">👨‍🎓 Student</option>
            <option value="faculty">👨‍🏫 Faculty</option>
            <option value="parent">👨‍👩‍👧 Parent</option>
            <option value="admin">👨‍💼 Admin</option>
          </select>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Username</label>
        <div class="field-wrap">
          <i class="fas fa-user"></i>
          <input class="field-input" id="regUsername" placeholder="Choose a username" autocomplete="off">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <i class="fas fa-lock"></i>
          <input class="field-input" id="regPassword" type="password" placeholder="Choose a password" onkeydown="if(event.key==='Enter')register()">
        </div>
      </div>
      <button class="btn-login" onclick="register()">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
<script>
  function selectRole(role) {
    document.getElementById('role').value = role;
    document.querySelectorAll('.role-pill').forEach(p => {
      p.classList.toggle('selected', p.dataset.role === role);
    });
  }
  function showLogin() {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('registerBox').style.display = 'none';
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('tabRegister').classList.remove('active');
  }
  function showRegister() {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('registerBox').style.display = 'block';
    document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('tabRegister').classList.add('active');
  }
  // Add loading state to login button
  const _origLogin = window.login;
  document.getElementById('loginBtn').addEventListener('click', function() {
    this.classList.add('loading');
    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
    setTimeout(() => {
      this.classList.remove('loading');
      this.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }, 3000);
  });
</script>
</body>
</html>
